[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aikimap"
version = "0.1.0"
description = "Live, read-only Git maps for coding-agent sessions"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["git", "code-review", "repository-visualization", "coding-agents"]
dependencies = [
  "plotly>=6.0,<7.0",
  "pywebview>=5.0,<7.0",
]

[project.urls]
Repository = "https://github.com/anielhub-guru/aiki-map"
Issues = "https://github.com/anielhub-guru/aiki-map/issues"

[project.scripts]
aikimap = "aikimap_cli:main"

[tool.setuptools]
packages = ["aikimap_integration"]
py-modules = [
  "agent_launcher",
  "aikimap_cli",
  "corner_window",
  "git_reader",
  "hierarchy",
  "live_server",
  "platform_windows",
  "session",
  "snapshot_builder",
  "treemap_renderer",
  "visualizer",
]

[tool.setuptools.package-data]
aikimap_integration = ["SKILL.md"]
